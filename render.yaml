# Paid web service + persistent disk: review Render's pricing before deploying.
services:
  - type: web
    name: angel-med-spa
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data/angel-med-spa
    disk:
      name: angel-med-spa-data
      mountPath: /var/data
      sizeGB: 1
